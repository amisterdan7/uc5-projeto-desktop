<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Academia MisterFit</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-title">Academia MisterFit</div>
        <nav>
          <button class="nav-item active" data-view="alunos">Alunos</button>
          <button class="nav-item" data-view="planos">Planos</button>
          <button class="nav-item" data-view="matriculas">Matrículas</button>
        </nav>
      </aside>

      <main class="content">
        <section class="view" id="view-alunos">
          <header class="content-header">
            <h1>Alunos</h1>
            <button id="btn-novo-aluno" class="btn btn-primary">Área do Aluno</button>
          </header>

          <p id="aviso-plano-selecionado" class="empty-state" hidden></p>

          <form id="form-aluno" class="card form-grid">
            <div class="field">
              <label for="input-nome">Nome</label>
              <input id="input-nome" type="text" placeholder="Nome do aluno" required />
            </div>
            <div class="field">
              <label for="input-telefone" length="14">Telefone</label>
              <input id="input-telefone" type="text" placeholder="(84) 99999-0000" />
            </div>
            <div class="field">
              <label for="input-nascimento">Data de nascimento</label>
              <input id="input-nascimento" type="date" required />
            </div>
            <div class="field form-actions">
              <button type="button" id="btn-cancelar" class="btn">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
          </form>

          <div class="search-bar">
            <br />
            <input id="input-busca" type="text" placeholder="Buscar aluno" />
          </div>

          <table class="table" id="tabela-alunos">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Plano</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-alunos-body">
              <!-- linhas inseridas via renderer.ts -->
            </tbody>
          </table>
        </section>

        <section class="view" id="view-planos" hidden>
          <header class="content-header">
            <h1>Planos acessíveis para você treinar em nossas academias de alto padrão</h1>
            <br /><br />
          </header>

          <div class="planos-grid" id="planos-grid"></div>
        </section>

        <section class="view" id="view-matriculas" hidden>
          <header class="content-header">
            <h1>Matrículas</h1>
            <button id="btn-nova-matricula" class="btn btn-primary">+ Nova matrícula</button>
          </header>

          <form id="form-matricula" class="card form-grid" hidden>
            <div class="field">
              <label for="select-aluno">Aluno</label>
              <select id="select-aluno" required></select>
            </div>
            <div class="field">
              <label for="select-plano">Plano</label>
              <select id="select-plano" required></select>
            </div>
            <div class="field">
              <label for="input-data-inicio">Data de início</label>
              <input id="input-data-inicio" type="date" required />
            </div>
            <div class="field">
              <label for="input-data-fim">Vencimento</label>
              <input
                id="input-data-fim"
                type="text"
                disabled
                placeholder="Selecione plano e início"
              />
            </div>
            <div class="field form-actions">
              <button type="button" id="btn-cancelar-matricula" class="btn">Cancelar</button>
              <button type="submit" class="btn btn-primary">Matricular</button>
            </div>
          </form>

          <table class="table" id="tabela-matriculas">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Plano</th>
                <th>Início</th>
                <th>Vencimento</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-matriculas-body"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
